<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <!-- 静态托管时（无服务器响应头）也生效；连接仅放行自身与 AI 直连所需的 dashscope。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://dashscope.aliyuncs.com https://*.workers.dev https://*.fcapp.run; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6f8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="循动">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="从今天的时间出发，记录每一次运动与身体的反馈。">
    <title>循动 · 今天，动一点</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <dialog id="sheet" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <aside id="rest" class="rest" role="status" aria-live="polite" hidden></aside>
    <aside id="timer" class="timer" role="status" aria-live="polite" hidden></aside>
    <noscript>请启用 JavaScript 以使用训练记录。</noscript>
  </body>
</html>
